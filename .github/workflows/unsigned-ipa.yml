name: Build unsigned Trio IPA

# Запускается только вручную:
#   Actions -> "Build unsigned Trio IPA" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      # Настоящий номер команды Apple владельца сборки (Apple ID kirill, аккаунт onglock).
      # SideStore дописывает его к идентификатору приложения при установке — см. шаг упаковки.
      APPLE_TEAM_ID: 6F7G8P4DWX

    steps:
      - name: Show runner and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      - name: Checkout Trio with all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Remove signing requirements
        run: |
          # Config.xcconfig подключает ConfigOverride.xcconfig последним.
          # Подставляем фиктивный (несуществующий) ID команды Apple, чтобы Xcode
          # не искал реальный аккаунт разработчика. Ничего не подписывается.
          cat > ConfigOverride.xcconfig <<'EOF'
          DEVELOPER_TEAM = ONGLOCK001
          DEVELOPMENT_TEAM = ONGLOCK001
          EOF
          cat ConfigOverride.xcconfig

      - name: Build unsigned Release archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Trio.xcworkspace \
            -scheme Trio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Trio.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=ONGLOCK001 \
            BUNDLE_IDENTIFIER=org.nightscout.ONGLOCK001.trio \
            TRIO_APP_GROUP_ID=group.org.nightscout.ONGLOCK001.trio.trio-app-group \
            2>&1 | tee build.log

      - name: Package into Trio.ipa
        run: |
          set -euo pipefail
          APP="$(find build/Trio.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          echo "App bundle: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # полностью убираем следы подписи, если они появились
          find Payload -name '_CodeSignature' -type d -prune -exec rm -rf {} + || true
          find Payload -name 'embedded.mobileprovision' -delete || true

          # ---- связка "телефон <-> часы" (ошибка InvalidCompanionAppBundleIdentifier) ----
          # SideStore при установке дописывает к идентификатору приложения настоящий номер
          # команды Apple: в диалоге "AppID Customization" поле уже заполнено как
          # "<id приложения>.<номер команды>", галочка Append Team ID включена.
          # Info.plist приложения на часах SideStore не правит, поэтому вписываем
          # ожидаемое значение сразу: <id телефона>.<номер команды>.
          MAIN_ID="$(plutil -extract CFBundleIdentifier raw Payload/Trio.app/Info.plist)"
          WATCH_PLIST="Payload/Trio.app/Watch/Trio Watch App.app/Info.plist"
          WATCH_ID="$(plutil -extract CFBundleIdentifier raw "$WATCH_PLIST")"
          BEFORE="$(plutil -extract WKCompanionAppBundleIdentifier raw "$WATCH_PLIST")"
          EXPECTED="$MAIN_ID.$APPLE_TEAM_ID"

          echo "ДО ПРАВКИ:    телефон=$MAIN_ID"
          echo "ДО ПРАВКИ:    часы WKCompanionAppBundleIdentifier=$BEFORE"
          plutil -replace WKCompanionAppBundleIdentifier -string "$EXPECTED" "$WATCH_PLIST"
          AFTER="$(plutil -extract WKCompanionAppBundleIdentifier raw "$WATCH_PLIST")"
          echo "ПОСЛЕ ПРАВКИ: часы WKCompanionAppBundleIdentifier=$AFTER"
          echo "ОЖИДАЕТСЯ:    $EXPECTED"

          if [ "$AFTER" != "$EXPECTED" ]; then
            echo "::error::WKCompanionAppBundleIdentifier ($AFTER) не равен ожидаемому ($EXPECTED)"; exit 1
          fi
          echo "OK: часы будут ждать ровно тот идентификатор, который выдаст SideStore"

          # все ссылки на наш идентификатор в любых Info.plist (для проверки, что чужого нет)
          echo "--- все идентификаторы org.nightscout.ONGLOCK001 в Info.plist ---"
          find Payload -name Info.plist -print0 | xargs -0 -I{} plutil -p {} 2>/dev/null \
            | grep -E "org\.nightscout\.ONGLOCK001" | sed 's/^ *//' | sort -u

          zip -qry Trio.ipa Payload
          ls -lh Trio.ipa
          unzip -l Trio.ipa | head -15

      - name: Upload Trio.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Trio-unsigned-ipa
          path: Trio.ipa
          retention-days: 14

      - name: Upload build log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
