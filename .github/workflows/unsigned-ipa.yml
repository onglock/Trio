name: Build unsigned Trio IPA

# Запускается только вручную:
#   Actions -> "Build unsigned Trio IPA" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      # Настоящий номер команды Apple владельца сборки (Apple ID kirill, аккаунт onglock).
      # SideStore дописывает его к идентификатору приложения при установке — см. шаг упаковки.
      APPLE_TEAM_ID: 6F7G8P4DWX

    steps:
      - name: Show runner and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      - name: Checkout Trio with all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Remove signing requirements
        run: |
          # Config.xcconfig подключает ConfigOverride.xcconfig последним.
          # Подставляем фиктивный (несуществующий) ID команды Apple, чтобы Xcode
          # не искал реальный аккаунт разработчика. Ничего не подписывается.
          cat > ConfigOverride.xcconfig <<'EOF'
          DEVELOPER_TEAM = ONGLOCK001
          DEVELOPMENT_TEAM = ONGLOCK001
          EOF
          cat ConfigOverride.xcconfig

      - name: Build unsigned Release archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Trio.xcworkspace \
            -scheme Trio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Trio.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=ONGLOCK001 \
            BUNDLE_IDENTIFIER=org.nightscout.ONGLOCK001.trio.$APPLE_TEAM_ID \
            TRIO_APP_GROUP_ID=group.org.nightscout.ONGLOCK001.trio.trio-app-group \
            2>&1 | tee build.log

      - name: Package into Trio.ipa
        run: |
          set -euo pipefail
          APP="$(find build/Trio.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          echo "App bundle: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # полностью убираем следы подписи, если они появились
          find Payload -name '_CodeSignature' -type d -prune -exec rm -rf {} + || true
          find Payload -name 'embedded.mobileprovision' -delete || true

          # ---- идентификаторы под SideStore ----
          # Ошибки, которые лечит этот блок: WatchKitAppBundleIDNotPrefixed
          # (идентификатор часов обязан начинаться с "<идентификатор телефона>.")
          # и InvalidCompanionAppBundleIdentifier (часы обязаны ссылаться на телефон).
          # SideStore при установке подставляет новый идентификатор телефона как префикс
          # для вложенных частей, а часам префикс не правит. Поэтому номер команды Apple
          # (APPLE_TEAM_ID) уже вшит в идентификаторы на этапе сборки: тогда после установки
          # ничего не расходится.
          MAIN_ID="$(plutil -extract CFBundleIdentifier raw Payload/Trio.app/Info.plist)"
          WATCH_PLIST="Payload/Trio.app/Watch/Trio Watch App.app/Info.plist"
          COMPLICATION_PLIST="Payload/Trio.app/Watch/Trio Watch App.app/PlugIns/Trio Watch Complication Extension.appex/Info.plist"
          LIVE_PLIST="Payload/Trio.app/PlugIns/LiveActivityExtension.appex/Info.plist"

          WATCH_ID="$(plutil -extract CFBundleIdentifier raw "$WATCH_PLIST")"
          COMPLICATION_ID="$(plutil -extract CFBundleIdentifier raw "$COMPLICATION_PLIST")"
          LIVE_ID="$(plutil -extract CFBundleIdentifier raw "$LIVE_PLIST")"
          COMPANION_BEFORE="$(plutil -extract WKCompanionAppBundleIdentifier raw "$WATCH_PLIST")"

          echo "=== ДО ПРАВКИ ==="
          echo "телефон                             = $MAIN_ID"
          echo "часы                                = $WATCH_ID"
          echo "циферблат                           = $COMPLICATION_ID"
          echo "Live Activity                       = $LIVE_ID"
          echo "часы WKCompanionAppBundleIdentifier = $COMPANION_BEFORE"

          # связка часов должна указывать ровно на идентификатор телефона
          if [ "$COMPANION_BEFORE" != "$MAIN_ID" ]; then
            plutil -replace WKCompanionAppBundleIdentifier -string "$MAIN_ID" "$WATCH_PLIST"
          fi
          COMPANION_AFTER="$(plutil -extract WKCompanionAppBundleIdentifier raw "$WATCH_PLIST")"

          fail=0
          check_prefix() {  # $1 = значение, $2 = требуемый префикс, $3 = что это
            case "$1" in
              "$2".*) echo "OK: $3 — '$1' начинается с '$2.'" ;;
              *) echo "::error::$3: '$1' НЕ начинается с '$2.'"; fail=1 ;;
            esac
          }
          check_prefix "$WATCH_ID" "$MAIN_ID" "Bundle ID часов"
          check_prefix "$COMPLICATION_ID" "$WATCH_ID" "Bundle ID циферблата"
          check_prefix "$LIVE_ID" "$MAIN_ID" "Bundle ID Live Activity"
          if [ "$COMPANION_AFTER" != "$MAIN_ID" ]; then
            echo "::error::WKCompanionAppBundleIdentifier ('$COMPANION_AFTER') не равен Bundle ID телефона ('$MAIN_ID')"; fail=1
          else
            echo "OK: WKCompanionAppBundleIdentifier совпадает с Bundle ID телефона"
          fi

          echo "=== ПОСЛЕ ПРАВКИ ==="
          echo "телефон                             = $MAIN_ID"
          echo "часы                                = $WATCH_ID"
          echo "часы WKCompanionAppBundleIdentifier = $COMPANION_AFTER (было $COMPANION_BEFORE)"
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: префиксы вложенных частей и связка часов в порядке"

          # все ссылки на наш идентификатор в любых Info.plist (для проверки, что чужого нет)
          echo "--- все идентификаторы org.nightscout.ONGLOCK001 в Info.plist ---"
          find Payload -name Info.plist -print0 | xargs -0 -I{} plutil -p {} 2>/dev/null \
            | grep -E "org\.nightscout\.ONGLOCK001" | sed 's/^ *//' | sort -u

          zip -qry Trio.ipa Payload
          ls -lh Trio.ipa
          unzip -l Trio.ipa | head -15 || true

      - name: Upload Trio.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Trio-unsigned-ipa
          path: Trio.ipa
          retention-days: 14

      - name: Upload build log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
