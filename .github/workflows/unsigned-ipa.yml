name: Build unsigned Trio IPA

# Запускается только вручную:
#   Actions -> "Build unsigned Trio IPA" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      # Настоящий номер команды Apple владельца сборки (Apple ID kirill, аккаунт onglock).
      # SideStore дописывает его к идентификатору ТЕЛЕФОНА при установке.
      APPLE_TEAM_ID: 6F7G8P4DWX

    steps:
      - name: Show runner and Xcode versions
        run: |
          sw_vers
          xcodebuild -version
          ls /Applications | grep -i '^Xcode' || true

      - name: Checkout Trio with all submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Remove signing requirements
        run: |
          # Config.xcconfig подключает ConfigOverride.xcconfig последним.
          # Подставляем фиктивный (несуществующий) ID команды Apple, чтобы Xcode
          # не искал реальный аккаунт разработчика. Ничего не подписывается.
          cat > ConfigOverride.xcconfig <<'EOF'
          DEVELOPER_TEAM = ONGLOCK001
          DEVELOPMENT_TEAM = ONGLOCK001
          EOF
          cat ConfigOverride.xcconfig

      - name: Build unsigned Release archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Trio.xcworkspace \
            -scheme Trio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Trio.xcarchive" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=ONGLOCK001 \
            BUNDLE_IDENTIFIER=org.nightscout.ONGLOCK001.trio \
            TRIO_APP_GROUP_ID=group.org.nightscout.ONGLOCK001.trio.trio-app-group \
            2>&1 | tee build.log

      - name: Package into Trio.ipa
        run: |
          set -euo pipefail
          APP="$(find build/Trio.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          echo "App bundle: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # полностью убираем следы подписи, если они появились
          find Payload -name '_CodeSignature' -type d -prune -exec rm -rf {} + || true
          find Payload -name 'embedded.mobileprovision' -delete || true

          # ---- сборка ТОЛЬКО для iPhone ----
          # Вложенные приложения (Watch-приложение, циферблат, Live Activity) удаляем целиком.
          # Причина: SideStore дописывает номер команды Apple ТОЛЬКО к идентификатору телефона,
          # вложенным частям — нет, и любые попытки подогнать их идентификаторы по очереди
          # ломали то одну, то другую часть. Без вложенных частей подгонять нечего.
          echo "=== ДО ЧИСТКИ: вложенные бандлы ==="
          find Payload -mindepth 2 \( -name '*.app' -o -name '*.appex' \) -print || true
          echo "=== ЧТО УДАЛЯЮ ==="
          for d in "Payload/Trio.app/Watch" "Payload/Trio.app/PlugIns"; do
            if [ -d "$d" ]; then echo "  $d ($(du -sh "$d" | cut -f1))"; fi
          done
          find Payload -mindepth 2 -name '*.appex' -type d -prune -exec rm -rf {} + || true
          find Payload -mindepth 2 -name '*.app' -type d -prune -exec rm -rf {} + || true
          rm -rf Payload/Trio.app/Watch Payload/Trio.app/PlugIns
          # ссылка на Live Activity в основном Info.plist больше не нужна
          plutil -remove NSSupportsLiveActivities Payload/Trio.app/Info.plist 2>/dev/null || true

          # ---- идентификатор телефона ----
          # Единственный бандл в IPA — сам телефон, и он должен быть БЕЗ номера команды:
          # SideStore допишет его при установке (галочка "Append Team ID to Bundle Identifier"),
          # получится org.nightscout.ONGLOCK001.trio.6F7G8P4DWX
          EXPECTED_MAIN_ID="org.nightscout.ONGLOCK001.trio"
          MAIN_ID="$(plutil -extract CFBundleIdentifier raw Payload/Trio.app/Info.plist)"
          echo "телефон в сборке = $MAIN_ID (ожидается $EXPECTED_MAIN_ID)"
          if [ "$MAIN_ID" != "$EXPECTED_MAIN_ID" ]; then
            echo "::error::xcodebuild собрал идентификатор телефона '$MAIN_ID', а ожидался '$EXPECTED_MAIN_ID'."
            echo "::error::Проверь BUNDLE_IDENTIFIER в шаге 'Build unsigned Release archive': номера команды ($APPLE_TEAM_ID) там быть не должно — его дописывает SideStore."
            exit 1
          fi
          plutil -replace CFBundleURLTypes.0.CFBundleURLName -string "$EXPECTED_MAIN_ID" Payload/Trio.app/Info.plist
          # BGTaskSchedulerPermittedIdentifiers — массив; plutil -replace по индексу ДОБАВЛЯЕТ
          # элемент вместо замены, поэтому сначала сносим все элементы, потом вставляем один
          while plutil -extract BGTaskSchedulerPermittedIdentifiers.0 raw Payload/Trio.app/Info.plist >/dev/null 2>&1; do
            plutil -remove BGTaskSchedulerPermittedIdentifiers.0 Payload/Trio.app/Info.plist
          done
          plutil -insert BGTaskSchedulerPermittedIdentifiers.0 -string "$EXPECTED_MAIN_ID.background-task.critical-event-log" Payload/Trio.app/Info.plist

          # ---- проверки: при любом несовпадении прогон падает ----
          fail=0
          check_eq() {  # $1 = значение, $2 = ожидаемое, $3 = что это
            if [ "$1" = "$2" ]; then echo "OK: $3 — '$1'"; else echo "::error::$3: '$1' != '$2'"; fail=1; fi
          }
          PHONE_AFTER="$(plutil -extract CFBundleIdentifier raw Payload/Trio.app/Info.plist)"
          URLNAME_AFTER="$(plutil -extract CFBundleURLTypes.0.CFBundleURLName raw Payload/Trio.app/Info.plist)"
          BGTASK_AFTER="$(plutil -extract BGTaskSchedulerPermittedIdentifiers.0 raw Payload/Trio.app/Info.plist)"
          echo "=== ПОСЛЕ ЧИСТКИ ==="
          echo "телефон                             = $PHONE_AFTER"
          echo "телефон после правки SideStore      = $PHONE_AFTER.$APPLE_TEAM_ID"
          echo "CFBundleURLTypes.0.CFBundleURLName  = $URLNAME_AFTER"
          echo "BGTaskSchedulerPermittedIdentifiers = $BGTASK_AFTER"
          check_eq "$PHONE_AFTER" "$EXPECTED_MAIN_ID" "идентификатор телефона без номера команды"
          check_eq "$URLNAME_AFTER" "$EXPECTED_MAIN_ID" "CFBundleURLName телефона"
          check_eq "$BGTASK_AFTER" "$EXPECTED_MAIN_ID.background-task.critical-event-log" "BGTaskSchedulerPermittedIdentifiers.0"

          # 1) вложенных приложений и расширений не осталось
          NESTED="$(find Payload -mindepth 2 \( -name '*.app' -o -name '*.appex' \) -print || true)"
          if [ -n "$NESTED" ]; then
            echo "::error::в IPA остались вложенные приложения/расширения: $NESTED"; fail=1
          else
            echo "OK: вложенных приложений и расширений (app/appex) в IPA нет"
          fi
          for d in "Payload/Trio.app/Watch" "Payload/Trio.app/PlugIns"; do
            if [ -d "$d" ]; then echo "::error::папка $d осталась"; fail=1
            else echo "OK: папки $d нет"; fi
          done
          APP_COUNT="$(find Payload -maxdepth 1 -name '*.app' | wc -l | tr -d ' ')"
          check_eq "$APP_COUNT" "1" "бандл в Payload ровно один (сам телефон)"

          # 2) номера команды Apple в IPA нет вообще — ни в идентификаторах, ни в тексте
          TEAM_REFS="$(grep -r -a -l "$APPLE_TEAM_ID" Payload 2>/dev/null || true)"
          if [ -n "$TEAM_REFS" ]; then
            echo "::error::номер команды $APPLE_TEAM_ID найден в: $TEAM_REFS"; fail=1
          else
            echo "OK: номера команды $APPLE_TEAM_ID нет ни в одном файле IPA"
          fi

          # 3) связки часов больше нет: ключа WKCompanionAppBundleIdentifier быть не должно
          WK_COUNT="$(find Payload -name Info.plist -print0 | xargs -0 -I{} plutil -p {} 2>/dev/null | grep -c 'WKCompanionAppBundleIdentifier' || true)"
          check_eq "${WK_COUNT:-0}" "0" "ключ WKCompanionAppBundleIdentifier в IPA"

          [ "$fail" -eq 0 ] || exit 1
          echo "OK: IPA только для iPhone, идентификаторы чисты"

          # что осталось в IPA по нашим идентификаторам (для протокола)
          echo "--- все идентификаторы org.nightscout.ONGLOCK001 в Info.plist ---"
          find Payload -name Info.plist -print0 | xargs -0 -I{} plutil -p {} 2>/dev/null \
            | grep -E "org\.nightscout\.ONGLOCK001" | sed 's/^ *//' | sort -u
          echo "--- состав Payload после чистки ---"
          find Payload -maxdepth 2 \( -name '*.app' -o -name '*.appex' \) -print || true
          du -sh Payload/Trio.app

          zip -qry Trio.ipa Payload
          ls -lh Trio.ipa
          unzip -l Trio.ipa | head -15 || true

      - name: Upload Trio.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Trio-unsigned-ipa
          path: Trio.ipa
          retention-days: 14

      - name: Upload build log when the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
